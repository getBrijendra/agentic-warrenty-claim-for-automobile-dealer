dealer_rules:
  submission_window: {days: 30, label: "30 days", source: illustrative}
  pre_authorisation: {when: "amount_ex_vat > 6000", label: "> AED 6,000", source: illustrative}
  labour_tolerance: {pct: 10, requires_tech_note: false, label: "10% over standard time", source: illustrative}
  required_evidence:
    label: "DTC + photos"
    source: illustrative
    items:
      - {when: "is_electrical", kinds: [dtc_snapshot, photo], label: "DTC snapshot + photo"}
      - {when: "not is_electrical", kinds: [photo], label: "photo"}
  narrative_3c: {min_chars: 20, label: "3C", source: illustrative}
  parts_retention: {days: 60, label: "60 days", source: illustrative}
  repeat_repair: {days: 30, needs: flag, label: "Flag", source: illustrative}
  max_resubmissions: {value: 2, label: "2", source: illustrative}
  labour_rate_cap: {aed: 560, label: "AED 560/hr", source: illustrative}
  claim_format: {label: "Flat lines + cost codes", source: illustrative}
gateway_only_checks:
  - {rule: contract_scope, code: R09, label: "Component must be inside the active contract's scope"}
rejection_wording:
  R01: "Vehicle out of warranty."
  R03: "Labour above flat-rate time."
  R04: "RO documentation incomplete."
  R09: "Component not covered under Limited Extended Warranty (drive-line only)."
