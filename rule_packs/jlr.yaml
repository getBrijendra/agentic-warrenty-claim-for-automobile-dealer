programme: JLR
display_name: Jaguar Land Rover
brands: [Jaguar, Land Rover]
claim_prefix: JL
colour: "#1f6b4f"
status: active
pack_version: "2026.11.1"
claim_format: repair_sections
adjudication_delay_days: [3, 6]
payment_weekday: 1          # Tuesday
coverage:
  - contract_type: BASE
    label: New-vehicle warranty (regional listing; verify UAE terms)
    years: 5
    km_limit: 150000
    source: public
    source_url: https://www.dubizzle.com/motors/
    last_verified: null
  - contract_type: EXTENDED
    label: Extended warranty, up to
    years: 10
    km_limit: 275000
    note: For vehicles ≥ 3.5 years old. Service-history dependent.
    source: public
    source_url: https://www.drivearabia.com/
    last_verified: null
facts:
  - label: Years 4–5 coverage
    value: Some markets state years 4–5 coverage differs from years 1–3
    source: public
    source_url: https://www.jaguar.com.sg/
    last_verified: null
dealer_rules:
  submission_window: {days: 21, label: "21 days", source: illustrative}
  pre_authorisation: {when: "amount_ex_vat > 5000", label: "> AED 5,000", source: illustrative}
  labour_tolerance: {pct: 0, requires_tech_note: true, label: "0% (needs tech note)", source: illustrative}
  required_evidence:
    label: "Diagnostic session ID for any electrical job; DTC snapshot"
    source: illustrative
    items:
      - {when: "is_electrical", kinds: [diagnostic_session_id, dtc_snapshot], label: "diagnostic session ID + DTC snapshot"}
  narrative_3c: {min_chars: 20, require_test_result: true, label: "3C + test result", source: illustrative}
  parts_retention: {days: 90, label: "90 days", source: illustrative}
  repeat_repair: {days: 30, needs: ta_case, label: "Repeat repair → TA case", source: illustrative}
  max_resubmissions: {value: 1, label: "1", source: illustrative}
  labour_rate_cap: {aed: 480, label: "AED 480/hr", source: illustrative}
  claim_format: {label: "Grouped repair sections with symptom + fault codes", source: illustrative}
gateway_only_checks:
  - {rule: oem_repeat_repair, code: R08, days: 30, label: "Repeat repair at any retailer within 30 days needs a TA case"}
rejection_wording:
  R01: "VIN not eligible under warranty programme."
  R02: "Claim lodged after retailer submission deadline."
  R03: "Time claimed exceeds SRO allowance; no technical note."
  R04: "Diagnostic evidence missing from claim."
  R05: "Narrative lacks fault confirmation / test result."
  R06: "SRO and causal part inconsistent."
  R07: "Duplicate claim."
  R08: "Repeat repair: Technical Assistance case reference required."
  R10: "Open programme applies to VIN; claim under programme code."
  R12: "Non-approved modification fitted."
