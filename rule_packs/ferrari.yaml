dealer_rules:
  submission_window: {days: 30, label: "30 days", source: illustrative}
  pre_authorisation: {when: "is_powertrain or amount_ex_vat > 3000", label: "All powertrain + any > AED 3,000", source: illustrative}
  labour_tolerance: {pct: 15, requires_tech_note: false, label: "15% over standard time", source: illustrative}
  required_evidence:
    label: "Tech-support case ref for powertrain"
    source: illustrative
    items:
      - {when: "is_powertrain", kinds: [tech_support_ref], label: "technical support case reference"}
  narrative_3c: {min_chars: 20, require_support_ref_when: "is_powertrain", label: "3C + support ref", source: illustrative}
  parts_retention: {days: 120, label: "120 days", source: illustrative}
  repeat_repair: {days: 60, needs: pre_auth, label: "Repeat repair → always PA", source: illustrative}
  max_resubmissions: {value: 2, label: "2", source: illustrative}
  labour_rate_cap: {aed: 650, label: "AED 650/hr", source: illustrative}
  claim_format: {label: "Single section + support ticket", source: illustrative}
gateway_only_checks:
  - {rule: oem_repeat_repair, code: R08, days: 60, label: "Repeat repair in OEM history requires authorisation"}
rejection_wording:
  R01: "Vehicle not covered."
  R03: "Operation time above allowed time."
  R04: "Technical assistance reference missing."
  R05: "Service Entry description incomplete."
  R08: "Authorisation code not present for this operation."
